# CyberCom Platform API (cymed) — standalone production stack.
# Deliberately isolated from the existing /opt/cybercom-platform stack
# (different network, different volumes, port 8011 not 8010) so this can
# be verified live without touching what's already serving cy-com.com.
# Cutting real traffic over (nginx repoint, port swap) is a separate,
# explicitly-approved step once this is confirmed healthy.
#
# Usage: docker compose --env-file .env.production -f docker-compose.api.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybercom-api-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cybercom_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybercom-api-net

  redis:
    image: redis:7-alpine
    container_name: cybercom-api-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - cybercom_api_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybercom-api-net

  # ── Identity (Keycloak) ────────────────────────────────────────────────────
  # No Keycloak existed anywhere on this VM before this deploy — it was
  # only ever set up in local/dev. Internal-only for now (no host port
  # exposed): cymed's own admin-API calls (creating demo tenant realms/
  # users) only need reachability from inside cybercom-api-net. Public
  # exposure for real browser PKCE login flows (admin panel, etc.) is a
  # separate, later step — this is dev-mode Keycloak, not yet hardened
  # for that.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cybercom-api-keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      # Loopback-only (not internet-reachable) - needed by host-level
      # processes outside Docker entirely, e.g. cycom-erp's Next.js
      # frontend (runs via pm2 directly on the host, not in a
      # container) for its own real Keycloak password-grant login.
      - "127.0.0.1:8090:8080"
    volumes:
      - cybercom_api_keycloak:/opt/keycloak/data
    healthcheck:
      # No curl/wget in this image (UBI-minimal), and the management
      # port (9000) isn't listening in this default start-dev config -
      # /health/ready lives on the main port (8080) instead, confirmed
      # by direct port probing on the live server. Plain TCP-connect
      # check via bash's /dev/tcp - good enough since nothing actually
      # depends on this health condition (backend uses service_started).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - cybercom-api-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.cymed
    image: cybercom-api-backend:prod
    container_name: cybercom-api-backend
    restart: always
    ports:
      - "8011:8000"
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - cybercom-api-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    image: cybercom-api-backend:prod
    container_name: cybercom-api-celery
    restart: always
    command: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=200"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME --timeout=5 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - cybercom-api-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  cybercom-api-net:
    driver: bridge

volumes:
  cybercom_api_pgdata:
    driver: local
  cybercom_api_redisdata:
    driver: local
  cybercom_api_keycloak:
    driver: local
