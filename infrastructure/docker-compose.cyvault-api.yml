# CyVault (object storage / DICOM archiving) API — standalone production
# stack. Own network/volumes/port (8013 — not 8011/8012/8010/8020 already
# in use). Cutting real traffic over (nginx repoint) is a separate,
# explicitly-approved step.
#
# Explicit `name:` matters for the same reason as cycom's compose file:
# without it, Compose infers the project name from the compose file's
# parent directory, which under the release-symlink deploy pattern is
# literally "current" for every product deployed this way.
#
# Keycloak is NOT duplicated here — reuses the same shared "cybercom"
# realm already running as part of cymed's stack (cybercom-api-keycloak,
# on cymed's cybercom-api-net network), matching every other product's
# CyIdentity integration this session.
#
# Includes a real MinIO service — no S3-compatible object storage existed
# anywhere in this repo before CyVault (confirmed repo-wide). CYVAULT_STORAGE_BACKEND
# defaults to Django's local FileSystemStorage; setting it to
# storages.backends.s3boto3.S3Boto3Storage (done below) points it at this
# MinIO instance instead.
#
# Usage: docker compose --env-file .env.production -f docker-compose.cyvault-api.yml up -d

name: cyvault-api

services:
  cyvault-postgres:
    image: postgres:16-alpine
    container_name: cyvault-api-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cyvault_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyvault-api-net

  cyvault-minio:
    image: minio/minio:latest
    container_name: cyvault-api-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CYVAULT_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${CYVAULT_S3_SECRET_ACCESS_KEY}
    volumes:
      - cyvault_api_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cyvault-api-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # One-shot: creates the bucket S3Boto3Storage writes to (MinIO doesn't
  # auto-create it) and exits. `backend` doesn't depend on this completing
  # — the bucket only needs to exist before the first real upload, and
  # blocking every deploy on it would be a needless coupling.
  cyvault-minio-init:
    image: minio/mc:latest
    container_name: cyvault-api-minio-init
    restart: "no"
    depends_on:
      cyvault-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://cyvault-minio:9000 ${CYVAULT_S3_ACCESS_KEY_ID} ${CYVAULT_S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${CYVAULT_S3_BUCKET}
      "
    networks:
      - cyvault-api-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.cyvault
    image: cyvault-api-backend:prod
    container_name: cyvault-api-backend
    restart: always
    ports:
      - "8013:8000"
    env_file: .env.production
    environment:
      # Points the pluggable storage backend (core/settings.py) at this
      # stack's own MinIO instance rather than the FileSystemStorage
      # default — real S3-compatible object storage, not local disk.
      CYVAULT_STORAGE_BACKEND: storages.backends.s3boto3.S3Boto3Storage
      CYVAULT_S3_ENDPOINT_URL: http://cyvault-minio:9000
    depends_on:
      cyvault-postgres:
        condition: service_healthy
      cyvault-minio:
        condition: service_healthy
    networks:
      - cyvault-api-net
      - cymed-shared-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  cyvault-api-net:
    driver: bridge
  cymed-shared-net:
    name: current_cybercom-api-net
    external: true

volumes:
  cyvault_api_pgdata:
    driver: local
  cyvault_api_miniodata:
    driver: local
