# =============================================================================
# CyMed nginx reverse proxy (prod-like)
# TLS termination happens at the LB in real prod; local stack listens on :80.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging -----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rid=$http_x_request_id rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- Perf --------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 25m;
    client_body_timeout  60s;
    client_header_timeout 30s;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- Upstream ----------------------------------------------------------
    upstream cymed_api {
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ---- Correlation id ----------------------------------------------------
    # Preserve incoming X-Request-Id or synthesise one.
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # =========================================================================
    # HTTPS server (TLS terminated at nginx) — stub, uncomment in prod
    # =========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name cymed.example.com api.cymed.example.com;
    #
    #     ssl_certificate     /etc/nginx/tls/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/tls/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "DENY" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     # ...same location blocks as :80 below...
    # }
    #
    # server {
    #     listen 80;
    #     server_name cymed.example.com api.cymed.example.com;
    #     return 301 https://$host$request_uri;
    # }

    # =========================================================================
    # HTTP :80 — used directly by the prod-like local stack
    # =========================================================================
    server {
        listen      80 default_server;
        server_name _;

        # Health endpoint proxied through to API (LB pings this too).
        location = /health {
            access_log off;
            proxy_pass http://cymed_api/health;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
        }

        # Everything else -> Django.
        location / {
            proxy_pass         http://cymed_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-Id      $req_id;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       on;
        }
    }
}
