# =============================================================================
# CyMed prod-like docker-compose stack
# NOT for production. Mirrors the shape of the K8s deployment so integration
# tests, load tests, and demos run against realistic wiring.
#
# Usage:
#   cp .env.example .env  # then fill in secrets
#   docker compose -f deploy/docker/docker-compose.prod-like.yml up -d
# =============================================================================
name: cymed-prodlike

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cymed}
      POSTGRES_USER: ${POSTGRES_USER:-cymed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: cymed-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      PLATFORM_ENV: prod-like
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymed}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cymed}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-please-set-in-env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      LOG_LEVEL: INFO
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    image: cymed-worker:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      PLATFORM_ENV: prod-like
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymed}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cymed}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-please-set-in-env}
      LOG_LEVEL: INFO
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  beat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.beat
    image: cymed-beat:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      PLATFORM_ENV: prod-like
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymed}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cymed}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_BEAT_LOCK: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-please-set-in-env}
      LOG_LEVEL: INFO
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  # Public-facing network — nginx and api share it.
  frontend:
    driver: bridge
  # Private network — datastores and workers, no ingress.
  backend:
    driver: bridge
    internal: false
