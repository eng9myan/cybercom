apiVersion: v1
kind: ConfigMap
metadata:
  name: cymed-env
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed
    app.kubernetes.io/part-of: cymed-platform
# Non-secret config only. Anything with a credential lives in the Secret.
data:
  PLATFORM_ENV: "production"
  LOG_LEVEL: "INFO"
  DJANGO_SETTINGS_MODULE: "core.settings"
  # Comma-separated. Overlays typically override this per environment.
  ALLOWED_HOSTS: "cymed.example.com,api.cymed.example.com"
  # Trust the ingress-nginx X-Forwarded-* headers.
  SECURE_PROXY_SSL_HEADER_NAME: "HTTP_X_FORWARDED_PROTO"
  SECURE_PROXY_SSL_HEADER_VALUE: "https"
  # Celery queue routing — matches Dockerfile.worker CMD.
  CELERY_QUEUES: "payments,integrations,notifications,ai_cds,default"
  CELERY_TASK_DEFAULT_QUEUE: "default"
  CELERY_TIMEZONE: "UTC"
  # Feature flags default off; overlays flip per env.
  FEATURE_AI_CDS: "true"
  FEATURE_TELEHEALTH: "true"
  # Telemetry endpoints (URLs only; tokens live in the Secret).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_SERVICE_NAME: "cymed-api"
