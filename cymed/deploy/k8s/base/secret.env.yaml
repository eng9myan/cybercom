# =============================================================================
# CyMed Secret — PLACEHOLDER
#
# !!  DO NOT COMMIT THIS FILE WITH REAL VALUES.                              !!
# !!  SEAL IT WITH kubeseal BEFORE COMMITTING:                               !!
# !!                                                                          !!
# !!      kubeseal --format=yaml \                                           !!
# !!        --controller-namespace=kube-system \                             !!
# !!        --controller-name=sealed-secrets-controller \                    !!
# !!        < secret.env.yaml \                                              !!
# !!        > sealed-secret.env.yaml                                         !!
# !!                                                                          !!
# !!  Then reference `sealed-secret.env.yaml` from kustomization.yaml and    !!
# !!  keep this template out of the resource list (or leave empty).          !!
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cymed-secrets
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed
    app.kubernetes.io/part-of: cymed-platform
type: Opaque
stringData:
  # ---- Django ----------------------------------------------------------------
  SECRET_KEY: ""

  # ---- Database --------------------------------------------------------------
  DATABASE_URL: ""            # postgresql://user:pass@host:5432/cymed?sslmode=require
  POSTGRES_PASSWORD: ""

  # ---- Redis / Celery --------------------------------------------------------
  REDIS_URL: ""               # redis://:pass@redis:6379/0
  CELERY_BROKER_URL: ""       # redis://:pass@redis:6379/1
  CELERY_RESULT_BACKEND: ""   # redis://:pass@redis:6379/1
  CELERY_BEAT_LOCK: ""        # redis://:pass@redis:6379/2

  # ---- Integrations ----------------------------------------------------------
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  TWILIO_AUTH_TOKEN: ""
  SENDGRID_API_KEY: ""

  # ---- Healthcare integrations ----------------------------------------------
  WHO_ICD11_CLIENT_ID: ""
  WHO_ICD11_CLIENT_SECRET: ""

  # ---- AI providers ----------------------------------------------------------
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

  # ---- Telemetry -------------------------------------------------------------
  OTEL_EXPORTER_OTLP_HEADERS: ""     # e.g. authorization=Bearer XXX
  SENTRY_DSN: ""

  # ---- Object storage --------------------------------------------------------
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_STORAGE_BUCKET_NAME: ""
