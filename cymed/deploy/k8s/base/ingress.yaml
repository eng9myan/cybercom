apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cymed
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed
    app.kubernetes.io/part-of: cymed-platform
  annotations:
    # ---- ingress-nginx ------------------------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/enable-cors: "false"
    # HSTS + hardening — belt-and-braces with the app-level middleware.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Simple per-IP rate limit; overlays tune per env.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # ---- cert-manager -------------------------------------------------------
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cymed.example.com
        - api.cymed.example.com
      secretName: cymed-tls
  rules:
    - host: cymed.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cymed-api
                port:
                  number: 8000
    - host: api.cymed.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cymed-api
                port:
                  number: 8000
