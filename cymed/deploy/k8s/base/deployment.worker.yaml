apiVersion: apps/v1
kind: Deployment
metadata:
  name: cymed-worker
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cymed-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cymed-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cymed-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: cymed-platform
    spec:
      serviceAccountName: cymed-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Workers can be mid-task — give SIGTERM room before SIGKILL.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/cybercom/cymed-worker:latest  # overlay pins to :sha
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cymed-env
            - secretRef:
                name: cymed-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # No HTTP; use `celery inspect ping` as a liveness probe.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A core inspect ping -d "celery@$(hostname)" || exit 1
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A core inspect ping -d "celery@$(hostname)" || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cymed-worker
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed-worker
    app.kubernetes.io/part-of: cymed-platform
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cymed-worker
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed-worker
    app.kubernetes.io/part-of: cymed-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cymed-worker
      app.kubernetes.io/component: worker
