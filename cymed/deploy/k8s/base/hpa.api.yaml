apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cymed-api
  namespace: cymed
  labels:
    app.kubernetes.io/name: cymed-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cymed-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cymed-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Scale up quickly on sustained load, but don't thrash on 1-minute spikes.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Scale down conservatively — never yank more than a quarter of pods at once.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
