name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write     # cosign keyless

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cymed-api
            dockerfile: deploy/docker/Dockerfile.api
          - image: cymed-worker
            dockerfile: deploy/docker/Dockerfile.worker
          - image: cymed-beat
            dockerfile: deploy/docker/Dockerfile.beat
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      # Cosign signing — keyless via OIDC when no key is configured; otherwise
      # sign with the COSIGN_KEY secret. Skip cleanly when neither is available.
      - name: Install cosign
        if: ${{ env.HAVE_COSIGN_KEY == 'true' || github.event_name == 'push' }}
        env:
          HAVE_COSIGN_KEY: ${{ secrets.COSIGN_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign (keyed)
        if: ${{ env.HAVE_COSIGN_KEY == 'true' }}
        env:
          HAVE_COSIGN_KEY: ${{ secrets.COSIGN_KEY != '' }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.image }}
        run: |
          echo "$COSIGN_KEY" > cosign.key
          cosign sign --yes --key cosign.key "${IMAGE}@${DIGEST}"
          rm -f cosign.key

      - name: Cosign sign (keyless)
        if: ${{ env.HAVE_COSIGN_KEY != 'true' }}
        env:
          HAVE_COSIGN_KEY: ${{ secrets.COSIGN_KEY != '' }}
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
