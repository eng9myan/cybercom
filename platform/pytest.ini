[pytest]
DJANGO_SETTINGS_MODULE = core.settings
# run_tests.py / manage.py put platform/ on sys.path themselves (and graft the
# stdlib `platform` module first). Without this, pytest-django auto-adds
# platform/ as a project whenever cymed/cycom run `pytest ../platform/*/tests`,
# shadowing their own `core` package.
django_find_project = false
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short
testpaths =
    common/tests
    canonical/tests
    security/tests
    einvoicing/tests
    events/tests
    terminology/tests
    audit/tests
    cyidentity/tests
    tenant/tests
    notifications/tests
    wallet/tests
    provisioning/tests
    api/tests
    cyai/tests
    cydata/tests
    cyintegrationhub/tests
markers =
    unit: fast unit test, no DB
    integration: exercises the real auth / DB path
