[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["core", "products"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: pure unit tests (no DB, no network)",
    "integration: tests requiring DB or external services",
]

[tool.coverage.run]
source = ["."]
omit = [
    "manage.py",
    "*/migrations/*",
    "*/tests/*",
]
