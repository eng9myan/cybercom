# CyEd full stack. Run from the REPO ROOT:  docker compose -f CyEd/docker-compose.yml up
# (build context is the repo root so the shared platform/ + shared/ are included.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cyed}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - cyed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: CyEd/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a strong secret}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,api}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-cyed}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/4
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Optional provider seams:
      CYED_LLM_ENABLED: ${CYED_LLM_ENABLED:-}
      CYED_ANTHROPIC_API_KEY: ${CYED_ANTHROPIC_API_KEY:-}
      CYED_CYCOM_URL: ${CYED_CYCOM_URL:-}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./cyed-web
    environment:
      CYED_BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  cyed_pgdata:
