name: Validate and deploy CyVault API to Oracle Cloud

on:
  push:
    branches: [develop]
    paths:
      - "cyvault/**"
      - "platform/**"
      - "shared/**"
      - "infrastructure/Dockerfile.cyvault"
      - "infrastructure/docker-compose.cyvault-api.yml"
      - ".github/workflows/deploy-cyvault.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyvault-api-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      # settings_test overrides Postgres/Redis with SQLite/LocMemCache and
      # object storage with a real throwaway local temp dir (not mocked) -
      # no external services needed for CI at all.
      DJANGO_SETTINGS_MODULE: core.settings_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cyvault/requirements.txt

      - run: pip install -r cyvault/requirements.txt
      - run: python cyvault/manage.py check
      - run: python cyvault/manage.py migrate --noinput
      - run: cd cyvault && python -m pytest products/cyvault -q --no-cov

      # Build-only check (no push) — catches Dockerfile/dependency
      # errors before the deploy job ever reaches the real server, same
      # discipline as cymed's/cycom's pipelines.
      - run: docker build -f infrastructure/Dockerfile.cyvault -t cyvault-ci-build:${{ github.sha }} .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      # New secret — does not exist yet. Add it under Settings > Secrets
      # and variables > Actions before the first real run of this
      # workflow's deploy job. Contents: a full .env file with
      # DJANGO_SECRET_KEY, DJANGO_DEBUG, ALLOWED_HOSTS, DB_NAME, DB_USER,
      # DB_PASSWORD, CYIDENTITY_ISSUER, CYVAULT_S3_ACCESS_KEY_ID,
      # CYVAULT_S3_SECRET_ACCESS_KEY, CYVAULT_S3_BUCKET — see
      # cyvault/core/settings.py for the full list of read env vars.
      CYVAULT_PRODUCTION_ENV_FILE: ${{ secrets.CYVAULT_PRODUCTION_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${OCI_HOST:?Missing OCI_HOST}"
          : "${OCI_SSH_USER:?Missing OCI_SSH_USER}"
          : "${OCI_SSH_PRIVATE_KEY:?Missing OCI_SSH_PRIVATE_KEY}"
          : "${CYVAULT_PRODUCTION_ENV_FILE:?Missing CYVAULT_PRODUCTION_ENV_FILE}"

      - name: Prepare release bundle and SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$OCI_HOST" >> "$HOME/.ssh/known_hosts"

          # Same sibling-directory layout as cycom's/cymed's bundles:
          # cyvault/manage.py's namespace-bridging trick resolves
          # repo_root as its own parent directory, so platform/ and
          # shared/ must land as siblings of cyvault/, not nested inside
          # it. docker-compose.cyvault-api.yml lands at the bundle ROOT
          # (not nested under infrastructure/) since Compose resolves
          # build.context relative to the compose file's own directory.
          mkdir -p "$RUNNER_TEMP/bundle/cyvault" "$RUNNER_TEMP/bundle/platform" "$RUNNER_TEMP/bundle/shared" "$RUNNER_TEMP/bundle/infrastructure"
          git archive "$GITHUB_SHA:cyvault" | tar -x -C "$RUNNER_TEMP/bundle/cyvault"
          git archive "$GITHUB_SHA:platform" | tar -x -C "$RUNNER_TEMP/bundle/platform"
          git archive "$GITHUB_SHA:shared" | tar -x -C "$RUNNER_TEMP/bundle/shared"
          git archive "$GITHUB_SHA:infrastructure" | tar -x -C "$RUNNER_TEMP/bundle/infrastructure"
          mv "$RUNNER_TEMP/bundle/infrastructure/docker-compose.cyvault-api.yml" "$RUNNER_TEMP/bundle/docker-compose.cyvault-api.yml"
          tar -czf "$RUNNER_TEMP/cyvault-api-${GITHUB_SHA}.tar.gz" -C "$RUNNER_TEMP/bundle" .

          printf '%s\n' "$CYVAULT_PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/production.env"
          chmod 600 "$RUNNER_TEMP/production.env"

      - name: Transfer release to Oracle VM
        shell: bash
        run: |
          set -euo pipefail
          scp "$RUNNER_TEMP/cyvault-api-${GITHUB_SHA}.tar.gz" \
            "${OCI_SSH_USER}@${OCI_HOST}:/tmp/cyvault-api-${GITHUB_SHA}.tar.gz"
          scp "$RUNNER_TEMP/production.env" \
            "${OCI_SSH_USER}@${OCI_HOST}:/tmp/cyvault-api-${GITHUB_SHA}.env"

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${OCI_SSH_USER}@${OCI_HOST}" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          release="$1"
          app_root=/opt/cyvault-api
          release_dir="$app_root/releases/$release"

          sudo install -d -o "$USER" -g "$USER" "$app_root" "$app_root/releases" "$app_root/shared"
          install -d "$release_dir"
          tar -xzf "/tmp/cyvault-api-${release}.tar.gz" -C "$release_dir"
          install -m 600 "/tmp/cyvault-api-${release}.env" "$app_root/shared/.env.production"
          rm -f "/tmp/cyvault-api-${release}.tar.gz" "/tmp/cyvault-api-${release}.env"

          chmod +x "$release_dir/cyvault/scripts/"*.sh
          "$release_dir/cyvault/scripts/deploy-production.sh" "$release"
          REMOTE
