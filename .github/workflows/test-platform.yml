name: Test the shared platform layer

# The platform/ apps (common, security, einvoicing, tenant, events, ...) are
# shared by cycom and cymed but had no CI job of their own — they were only
# exercised as a side effect of the product suites, and several test modules
# (cyai, cydata, wallet, cyintegrationhub, terminology) ran nowhere. This job
# runs platform/'s standalone Django project.

on:
  push:
    branches: [develop]
    paths:
      - "platform/**"
      - "shared/**"
      - ".github/workflows/test-platform.yml"
  pull_request:
    paths:
      - "platform/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: core.settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements.txt

      - run: pip install -r platform/requirements.txt

      # run_tests.py grafts the stdlib `platform` module before Django loads —
      # the platform/ dir shadows it otherwise. Same wrapper used locally.
      - run: cd platform && python manage.py check
      - run: cd platform && python manage.py makemigrations --check --dry-run
      - run: cd platform && python manage.py migrate --noinput
      # The 3 "order-dependent" cyidentity integration failures and the cyai
      # Anthropic-stub failure this used to deselect are both root-caused and
      # fixed (session 2026-09-04 §26) — no more deselects needed here.
      - run: cd platform && python run_tests.py -q --no-cov
      - run: cd platform && python manage.py apply_rls --dry-run | head -20
      - run: cd platform && python manage.py dump_pii_map
      # backfill_audit_columns queries the DB, and platform's settings use an
      # in-memory sqlite that doesn't survive between manage.py calls — its
      # behaviour is covered by canonical/tests/test_canonical.py instead.

  rls-verify:
    # Real PostgreSQL row-level-security enforcement, live end to end — the
    # `test` job above runs on SQLite (no RLS support at all) so this is the
    # only place a broken policy or a broken verify_rls/apply_rls command
    # would ever be caught. Added after a manual staging run (session
    # 2026-09-04 §28) found and fixed 4 real bugs that had never been
    # exercised against a real Postgres before, including a policy that
    # crashed instead of failing closed whenever the tenant GUC was cleared
    # to '' (exactly what happens after every real request).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cybercom_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: core.settings
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: cybercom_rls
      DB_HOST: localhost
      DB_PORT: "5432"
      PLATFORM_RLS_ENFORCED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements.txt

      # psycopg is deliberately not in platform/requirements.txt — the
      # standalone platform project is SQLite-only by design. Only this job
      # needs a Postgres driver.
      - run: pip install -r platform/requirements.txt "psycopg[binary]>=3.1.0,<4.0.0"

      # The app role apply_rls/verify_rls are meant to run as: not superuser,
      # not BYPASSRLS (see their docstrings). CREATEDB isn't needed here (we
      # migrate a real named database, not a pytest-django-managed test db)
      # but is harmless to grant.
      - name: create the non-superuser app role
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d cybercom_rls -c
          "CREATE ROLE cybercom_app LOGIN PASSWORD 'cybercom_app_pw' NOSUPERUSER NOBYPASSRLS;"

      - name: migrate as the table owner
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: cd platform && python manage.py migrate --noinput

      - name: grant DML on the migrated tables to the app role
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d cybercom_rls -c
          "GRANT ALL ON ALL TABLES IN SCHEMA public TO cybercom_app;
           GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO cybercom_app;"

      - name: apply RLS policies as the table owner
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: cd platform && python manage.py apply_rls

      - name: verify RLS as the non-superuser app role, on every tenant-scoped table
        env:
          DB_USER: cybercom_app
          DB_PASSWORD: cybercom_app_pw
        run: |
          cd platform
          tables=$(python manage.py apply_rls --dry-run \
            | grep ': enable RLS' | sed -E 's/^-- (.*): enable RLS$/\1/')
          fail=0
          for t in $tables; do
            echo "== $t =="
            python manage.py verify_rls --table "$t" || fail=1
          done
          exit $fail
